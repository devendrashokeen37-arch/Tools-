<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #38040e; /* Rich Burgundy */
            color: #fff9e6; /* Pale Yellow / Soft Beige */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            font-style: italic;
            color: #ffe6b3;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        p {
            font-size: 0.9rem;
            color: #e0acb5;
        }

        /* App Navigation Dock */
        .dock {
            display: flex;
            gap: 12px;
            background: rgba(56, 4, 14, 0.85);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 230, 179, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .dock-btn {
            background: transparent;
            border: none;
            color: #e0acb5;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .dock-btn.active, .dock-btn:hover {
            background: #ffe6b3;
            color: #38040e;
            font-weight: 600;
        }

        /* App Container Windows */
        .app-container {
            width: 100%;
            max-width: 380px;
            background: rgba(45, 3, 11, 0.95);
            border: 1px solid rgba(255, 230, 179, 0.15);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .app-container.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CALCULATOR STYLES --- */
        #calc-screen {
            width: 100%;
            height: 65px;
            background: #230208;
            color: #ffe6b3;
            font-size: 1.8rem;
            text-align: right;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 230, 179, 0.1);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            background: #4a0613;
            color: #ffe6b3;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: #610819;
        }

        .calc-btn.operator {
            background: #80152b;
            color: #fff9e6;
            font-weight: 600;
        }

        .calc-btn.equal {
            background: #ffe6b3;
            color: #38040e;
            font-weight: bold;
        }

        /* --- CALENDAR STYLES --- */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffe6b3;
        }

        .calendar-header button {
            background: none;
            border: none;
            color: #ffe6b3;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 10px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.8rem;
            color: #d1949f;
            margin-bottom: 8px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day {
            padding: 10px 0;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            background: #4a0613;
            color: #ffe6b3;
            transition: 0.2s;
        }

        .day:hover {
            background: #610819;
        }

        .day.selected {
            background: #ffe6b3;
            color: #38040e;
            font-weight: bold;
        }

        .day.empty {
            background: transparent;
            cursor: default;
        }

        .event-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 230, 179, 0.15);
            padding-top: 15px;
        }

        .event-input-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .event-input-group input {
            flex: 1;
            background: #230208;
            border: 1px solid rgba(255, 230, 179, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            color: #ffe6b3;
            font-size: 0.9rem;
        }

        .event-input-group button {
            background: #ffe6b3;
            color: #38040e;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .event-list {
            margin-top: 10px;
            max-height: 90px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #ffd6ad;
        }

        .event-item {
            background: #4a0613;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* --- CLOCK & TIMER STYLES --- */
        .clock-display {
            text-align: center;
            font-size: 2.8rem;
            font-weight: 300;
            color: #ffe6b3;
            margin-bottom: 5px;
        }

        .date-display {
            text-align: center;
            font-size: 0.9rem;
            color: #d1949f;
            margin-bottom: 25px;
        }

        .timer-section {
            border-top: 1px solid rgba(255, 230, 179, 0.15);
            padding-top: 20px;
            text-align: center;
        }

        .timer-screen {
            font-size: 2rem;
            font-weight: 300;
            color: #ffe6b3;
            margin-bottom: 15px;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .timer-btn {
            background: #4a0613;
            color: #ffe6b3;
            border: 1px solid rgba(255, 230, 179, 0.2);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .timer-btn:hover {
            background: #610819;
        }

        .timer-btn.primary {
            background: #ffe6b3;
            color: #38040e;
            font-weight: 600;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Personal Workspace</h1>
        <p>Burgundy & Pale Yellow Suite</p>
    </header>

    <!-- App Navigation Dock -->
    <div class="dock">
        <button class="dock-btn active" onclick="switchApp('calc')">Calculator</button>
        <button class="dock-btn" onclick="switchApp('calendar')">Calendar</button>
        <button class="dock-btn" onclick="switchApp('clock')">Clock</button>
    </div>

    <!-- 1. CALCULATOR APP -->
    <div id="app-calc" class="app-container active">
        <div id="calc-screen">0</div>
        <div class="calc-grid">
            <button class="calc-btn operator" onclick="clearCalc()">C</button>
            <button class="calc-btn operator" onclick="appendCalc('%')">%</button>
            <button class="calc-btn operator" onclick="appendCalc('/')">÷</button>
            <button class="calc-btn operator" onclick="appendCalc('*')">×</button>
            <button class="calc-btn" onclick="appendCalc('7')">7</button>
            <button class="calc-btn" onclick="appendCalc('8')">8</button>
            <button class="calc-btn" onclick="appendCalc('9')">9</button>
            <button class="calc-btn operator" onclick="appendCalc('-')">-</button>
            <button class="calc-btn" onclick="appendCalc('4')">4</button>
            <button class="calc-btn" onclick="appendCalc('5')">5</button>
            <button class="calc-btn" onclick="appendCalc('6')">6</button>
            <button class="calc-btn operator" onclick="appendCalc('+')">+</button>
            <button class="calc-btn" onclick="appendCalc('1')">1</button>
            <button class="calc-btn" onclick="appendCalc('2')">2</button>
            <button class="calc-btn" onclick="appendCalc('3')">3</button>
            <button class="calc-btn equal" onclick="calculateResult()">=</button>
            <button class="calc-btn" onclick="appendCalc('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="appendCalc('.')">.</button>
        </div>
    </div>

    <!-- 2. CALENDAR APP -->
    <div id="app-calendar" class="app-container">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">‹</button>
            <span id="month-year-display"></span>
            <button onclick="changeMonth(1)">›</button>
        </div>
        <div class="weekdays">
            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
        </div>
        <div class="days-grid" id="days-grid"></div>

        <div class="event-section">
            <p id="selected-date-label" style="font-size: 0.85rem; color: #ffe6b3;">Select a date to add events</p>
            <div class="event-input-group">
                <input type="text" id="event-input" placeholder="Add an event...">
                <button onclick="addEvent()">Save</button>
            </div>
            <div class="event-list" id="event-list"></div>
        </div>
    </div>

    <!-- 3. CLOCK & TIMER APP -->
    <div id="app-clock" class="app-container">
        <div class="clock-display" id="live-clock">00:00:00</div>
        <div class="date-display" id="live-date">Loading date...</div>

        <div class="timer-section">
            <div class="timer-screen" id="timer-display">00:00:00</div>
            <div class="timer-controls">
                <button class="timer-btn primary" id="timer-start-btn" onclick="toggleTimer()">Start</button>
                <button class="timer-btn" onclick="resetTimer()">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // --- APP SWITCHER ---
        function switchApp(appName) {
            document.querySelectorAll('.app-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.dock-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('app-' + appName).classList.add('active');
            event.target.classList.add('active');
        }

        // --- CALCULATOR LOGIC ---
        let calcScreen = document.getElementById('calc-screen');
        let currentInput = '0';

        function appendCalc(val) {
            if (currentInput === '0' && val !== '.') {
                currentInput = val;
            } else {
                currentInput += val;
            }
            calcScreen.innerText = currentInput;
        }

        function clearCalc() {
            currentInput = '0';
            calcScreen.innerText = currentInput;
        }

        function calculateResult() {
            try {
                currentInput = eval(currentInput.replace('×', '*').replace('÷', '/')).toString();
                calcScreen.innerText = currentInput;
            } catch (error) {
                calcScreen.innerText = 'Error';
                currentInput = '0';
            }
        }

        // --- CALENDAR LOGIC ---
        let today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();
        let selectedDateStr = formatDateKey(today);
        let events = {};

        const monthsNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function renderCalendar() {
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            document.getElementById('month-year-display').innerText = `${monthsNames[currentMonth]} ${currentYear}`;
            let grid = document.getElementById('days-grid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                let emptyCell = document.createElement('div');
                emptyCell.classList.add('day', 'empty');
                grid.appendChild(emptyCell);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                let dayCell = document.createElement('div');
                dayCell.classList.add('day');
                dayCell.innerText = d;
                
                let dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                if (dateStr === selectedDateStr) {
                    dayCell.classList.add('selected');
                }

                dayCell.onclick = () => {
                    selectedDateStr = dateStr;
                    renderCalendar();
                    loadEvents();
                };

                grid.appendChild(dayCell);
            }
            loadEvents();
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function formatDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function addEvent() {
            let input = document.getElementById('event-input');
            let val = input.value.trim();
            if (!val) return;

            if (!events[selectedDateStr]) {
                events[selectedDateStr] = [];
            }
            events[selectedDateStr].push(val);
            input.value = '';
            loadEvents();
        }

        function loadEvents() {
            document.getElementById('selected-date-label').innerText = `Events for: ${selectedDateStr}`;
            let list = document.getElementById('event-list');
            list.innerHTML = '';

            let dayEvents = events[selectedDateStr] || [];
            if (dayEvents.length === 0) {
                list.innerHTML = '<div style="color: #d1949f; font-style: italic;">No events planned.</div>';
                return;
            }

            dayEvents.forEach((ev, idx) => {
                let item = document.createElement('div');
                item.classList.add('event-item');
                item.innerHTML = `<span>${ev}</span> <span style="cursor:pointer; color:#d1949f;" onclick="deleteEvent('${selectedDateStr}', ${idx})">&times;</span>`;
                list.appendChild(item);
            });
        }

        function deleteEvent(dateStr, idx) {
            events[dateStr].splice(idx, 1);
            loadEvents();
        }

        // --- CLOCK & TIMER LOGIC ---
        function updateLiveClock() {
            let now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString();
            document.getElementById('live-date').innerText = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // Stopwatch / Timer functionality
        let timerSeconds = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        function toggleTimer() {
            let btn = document.getElementById('timer-start-btn');
            if (!isTimerRunning) {
                isTimerRunning = true;
                btn.innerText = 'Pause';
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    formatTimerDisplay();
                }, 1000);
            } else {
                isTimerRunning = false;
                btn.innerText = 'Resume';
                clearInterval(timerInterval);
            }
        }

        function resetTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            timerSeconds = 0;
            formatTimerDisplay();
            document.getElementById('timer-start-btn').innerText = 'Start';
        }

        function formatTimerDisplay() {
            let hrs = Math.floor(timerSeconds / 3600);
            let mins = Math.floor((timerSeconds % 3600) / 60);
            let secs = timerSeconds % 60;
            document.getElementById('timer-display').innerText = 
                `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // Initial render for calendar
        renderCalendar();
    </script>
</body>
</html>
